model_list:
  # --- Provider 1: NVIDIA NIM (Private Architecture, Coding, Polish & Safety) ---
  - model_name: studio-architect
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-core-coder
    litellm_params:
      model: openai/nvidia/nemotron-4-340b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-long-context
    litellm_params:
      model: openai/moonshotai/kimi-k3.1-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-balanced-coder
    litellm_params:
      model: openai/nvidia/nemotron-3-super-120b-a12b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-fast-patch
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-reward-judge
    litellm_params:
      model: openai/nvidia/nemotron-4-340b-reward
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-content-safety
    litellm_params:
      model: openai/nvidia/nemotron-3.5-content-safety
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-omni-backup-qa
    litellm_params:
      model: openai/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  # --- Provider 2: Google Gemini API (Multimodal Video/Image QA & Decision Gate) ---
  - model_name: studio-video-qa-primary
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 12

  - model_name: studio-video-qa-secondary
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 12

  - model_name: studio-decision-gate
    litellm_params:
      model: gemini/gemini-decision-1
      api_key: os.environ/GEMINI_API_KEY
      rpm: 150

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 60
  cooldown_time: 30
  fallbacks:
    - studio-architect: [studio-balanced-coder, studio-fast-patch]
    - studio-core-coder: [studio-architect, studio-balanced-coder, studio-fast-patch]
    - studio-video-qa-primary: [studio-video-qa-secondary, studio-omni-backup-qa]
