# AI Game Studio V8.0 — Anti-429 Dual-LLM Routing Configuration
general_settings:
  min_call_delay_sec: 3.5
  backoff_schedule_sec: [15, 30, 60]
  private_coding_provider: nvidia_nim
  vision_qa_primary_provider: gemini

model_list:
  # Private NVIDIA NIM ONLY — Blueprints, GDScript 4.7.2 Coding, Self-Heal, Safety
  - model_name: studio-architect
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-core-coder
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-4-340b-instruct
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-long-context
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3.1-pro
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-balanced-coder
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-fast-patch
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-reward-judge
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-4-340b-reward
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  - model_name: studio-content-safety
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-content-safety
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35

  # Google Gemini API — Decision Gate & Primary Multimodal Vision QA
  - model_name: studio-decision-gate
    litellm_params:
      model: gemini/gemini-decision-1
      api_key: os.environ/GEMINI_API_KEY
      rpm: 150

  - model_name: studio-vision-primary
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: studio-vision-secondary
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: studio-vision-backup
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35
