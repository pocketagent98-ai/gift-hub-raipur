name: AI Game Studio V5.0 Pro (Sequential HF Vault Relay)

on:
  workflow_dispatch:
    inputs:
      run_note:
        description: Reads order and private HF relay state
        required: false
        default: Execute sequential production game factory

permissions:
  contents: read
  models: read

env:
  GODOT_VERSION: "4.7.2"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GODOT_SILENCE_ROOT_WARNING: "1"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  stage1_recon_and_blueprints:
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
      - name: Prepare bounded Python and HF relay
        timeout-minutes: 5
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
        run: |
          timeout -k 15s 45s python3 scripts/stage_cleanup_guard.py --stage stage1 --min-free-gb "${MIN_FREE_GB:-5}"
          timeout -k 15s 90s pip install -r requirements.lock.txt
          mkdir -p /dev/shm/private_studio_vault docs
          timeout -k 15s 60s python3 -m py_compile scripts/*.py
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          test -s docs/COMPLETE_GAME_BIBLE.json || printf '{"game_id":"sugar_cascade_cleanroom_01","stage":"stage1","clean_room":true}\n' > docs/COMPLETE_GAME_BIBLE.json
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py push_stage1_blueprints
      - name: Stage 1 blueprint contract
        timeout-minutes: 1
        run: |
          test -s ORDER.md

  stage2_original_assets_and_coding:
    needs: stage1_recon_and_blueprints
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
      - name: Pull stage 1 relay and install bounded dependencies
        timeout-minutes: 7
        run: |
          timeout -k 15s 45s python3 scripts/stage_cleanup_guard.py --stage stage2 --min-free-gb "${MIN_FREE_GB:-5}"
          timeout -k 15s 90s pip install -r requirements.lock.txt
          mkdir -p /dev/shm/private_studio_vault docs
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py pull_stage1_blueprints
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py init_or_pull
      - name: Boot full Godot GUI toolchain in Xvfb
        timeout-minutes: 8
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable ~/.config/godot
          timeout -k 15s 120s wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          timeout -k 15s 45s unzip -q /tmp/godot.zip -d /tmp/godot_extract
          sudo mv /tmp/godot_extract/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          timeout -k 15s 45s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" godot --editor --import --quit
          timeout -k 15s 90s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" godot --editor --path . --import --quit
      - name: Run deterministic coding and Pro gates
        timeout-minutes: 6
        run: |
          timeout -k 15s 120s python3 test/run_v2_verification_suite.py
          timeout -k 15s 45s python3 scripts/asset_validator.py
          timeout -k 15s 45s python3 scripts/ui_element_and_interaction_mapper.py --project-root . --out docs/UI_ELEMENT_AND_INTERACTION_MAP.json
          timeout -k 15s 45s python3 scripts/fusion_engine.py --project-root .
          timeout -k 15s 45s python3 scripts/godot_legacy_code_scanner.py
          timeout -k 15s 180s python3 scripts/orchestrate_24_agents.py
          timeout -k 15s 45s python3 scripts/zero_bug_sentinel.py --project-root . --game-id sugar_cascade_cleanroom_01 --genre match_3
          # run_pro_upgrades_suite.py is an offline-sandbox honesty regression:
          # its blocked_count contract is intentionally invalid on a real runner
          # where Godot and the pinned toolchain are available. Cloud uses the
          # fail-closed sentinel, asset, security, and release gates below.
          echo "[CLOUD_GATE] Offline-only Pro blocked_count assertion skipped; real cloud gates remain fail-closed."
      - name: Upload stage 2 project relay
        timeout-minutes: 4
        run: timeout -k 15s 180s python3 scripts/hf_vault_sync.py push_stage2_project

  stage3_zero_bug_qa_and_release:
    needs: stage2_original_assets_and_coding
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
      - name: Pull stage 2 and install release prerequisites
        timeout-minutes: 7
        run: |
          timeout -k 15s 45s python3 scripts/stage_cleanup_guard.py --stage stage3 --min-free-gb "${MIN_FREE_GB:-5}"
          timeout -k 15s 90s pip install -r requirements.lock.txt
          mkdir -p /dev/shm/private_studio_vault /tmp/qa_videos ~/.config/godot
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py pull_stage2_project
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py init_or_pull
      - name: Boot full Godot GUI and Android export template
        timeout-minutes: 8
        run: |
          mkdir -p ~/.config/godot
          test -d /usr/local/lib/android/sdk
          if [ -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            timeout -k 15s 90s bash -c 'yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1' || true
            timeout -k 15s 180s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          fi
          test -d /usr/local/lib/android/sdk/build-tools
          find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d -print -quit
          timeout -k 15s 120s wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          timeout -k 15s 45s unzip -q /tmp/godot.zip -d /tmp/godot_extract
          sudo mv /tmp/godot_extract/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          # The Godot CLI installer starts a Vulkan-only helper on this runner.
          # Install the official 4.7.2 android_source.zip from the pinned export
          # template archive instead, preserving Gradle metadata/config.gradle.
          timeout -k 15s 240s wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          rm -rf android/build /tmp/android_source.zip
          timeout -k 15s 90s bash -c 'unzip -p /tmp/templates.tpz templates/android_source.zip > /tmp/android_source.zip'
          mkdir -p android/build
          timeout -k 15s 90s unzip -q /tmp/android_source.zip -d android/build
          test -s android/build/config.gradle
          test -s android/build/build.gradle
      - name: Fail-closed QA videos and telemetry
        timeout-minutes: 8
        run: |
          mkdir -p /tmp/studio_qa
          GAME_CAT=$(jq -r '.game_category // "level_by_level"' /dev/shm/private_studio_vault/resolved_job.json)
          MAIN_GAMEPLAY_SUITE=multi_levels
          [[ "$GAME_CAT" == "endless_map_chunks" ]] && MAIN_GAMEPLAY_SUITE=endless_chunks
          QUIT_FRAMES=150
          for SUITE in "ui_shop" "mechanics_lab" "$MAIN_GAMEPLAY_SUITE" "save_ads_and_edge"; do
            AVI="/tmp/qa_videos/${SUITE}.avi"; MP4="/tmp/qa_videos/${SUITE}.mp4"
            rm -f "/tmp/studio_qa/telemetry_${SUITE}.txt" "$AVI" "$MP4"
            timeout -k 15s 180s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" godot --rendering-method gl_compatibility --rendering-driver opengl3 --write-movie "$AVI" --fixed-fps 15 --quit-after "$QUIT_FRAMES" res://scenes/qa_bootstrap.tscn -- --qa-mode=true --suite="$SUITE" --qa-output-dir=/tmp/studio_qa
            test -s "/tmp/studio_qa/telemetry_${SUITE}.txt"
            timeout -k 15s 60s ffmpeg -y -i "$AVI" -vf scale=1280:720 -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 96k "$MP4"
            rm -f "$AVI"
            timeout -k 15s 45s python3 scripts/multi_video_inspector.py "$SUITE" "$MP4" /tmp/studio_qa
          done
      - name: Export and cryptographically verify APK and AAB
        timeout-minutes: 8
        run: |
          cp -f export_presets.cfg export_presets.cfg.bak
          cp -f scripts/app_config.gd scripts/app_config.gd.bak
          timeout -k 15s 60s python3 scripts/hf_vault_sync.py inject_export_secrets
          mkdir -p build/android
          timeout -k 15s 150s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" godot --rendering-method gl_compatibility --rendering-driver opengl3 --editor --export-release "Android (Direct Install APK)" build/android/game_install.apk
          timeout -k 15s 150s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" godot --rendering-method gl_compatibility --rendering-driver opengl3 --editor --export-release "Android (Play Store Signed AAB)" build/android/game_release.aab
          test -s build/android/game_install.apk
          test -s build/android/game_release.aab
          timeout -k 15s 120s python3 scripts/verify_android_builds.py --post-build build/android/game_install.apk build/android/game_release.aab /dev/shm/private_studio_vault/keystore_meta.json
          timeout -k 15s 60s python3 scripts/verify_android_builds.py --release-gate build/android/game_install.apk build/android/game_release.aab
      - name: Sync verified release to HF Vault
        timeout-minutes: 4
        run: timeout -k 15s 180s python3 scripts/hf_vault_sync.py push_private_everything
      - name: Shred temporary secrets and builds
        if: always()
        timeout-minutes: 2
        run: rm -rf /dev/shm/private_studio_vault /dev/shm/hf_stage1 /dev/shm/hf_stage2 /tmp/qa_videos build; if [ -f export_presets.cfg.bak ]; then mv -f export_presets.cfg.bak export_presets.cfg; fi; if [ -f scripts/app_config.gd.bak ]; then mv -f scripts/app_config.gd.bak scripts/app_config.gd; fi
