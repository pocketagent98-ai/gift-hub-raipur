name: AI Game Studio V5.0 Pro (Sequential HF Vault Relay)

# 3 chained jobs. Every job gets a fresh Ubuntu runner, aggressive Step 0
# cleanup, a strict 30-minute budget, and per-command `timeout` guards.
# Godot is ALWAYS the full GUI editor inside Xvfb; --headless is never used.

on:
  workflow_dispatch:
    inputs:
      run_note:
        description: "Optional note stored with the run"
        required: false
        default: "V5.0 sequential relay"
      action_mode:
        description: "NEW_GAME / UPDATE_EXISTING / EXPORT_ONLY / FINALIZE_AND_LOCK_RELEASE"
        required: false
        default: ""
      final_package_name:
        description: "Final Play Store package (only for FINALIZE_AND_LOCK_RELEASE)"
        required: false
        default: ""
      final_app_name:
        description: "Final Play Store app name (only for FINALIZE_AND_LOCK_RELEASE)"
        required: false
        default: ""
      enable_anti_reverse_engineering:
        description: "true/false: enable final R8/vault/signature lock"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: ai-game-studio-v5-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_VERSION_TAG: "4.7.2-stable"
  GODOT_TEMPLATE_ID: "4.7.2.stable"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GODOT_SILENCE_ROOT_WARNING: "1"
  QT_QPA_PLATFORM: "xcb"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  MIN_FREE_GB: "6"

jobs:
  stage1_recon_and_blueprints:
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      action_mode: ${{ steps.mode.outputs.action_mode }}
      final_package_name: ${{ steps.mode.outputs.final_package_name }}
      final_app_name: ${{ steps.mode.outputs.final_app_name }}
      enable_anti_reverse_engineering: ${{ steps.mode.outputs.enable_anti_reverse_engineering }}
    env:
      INPUT_ACTION_MODE: ${{ inputs.action_mode }}
      INPUT_FINAL_PACKAGE_NAME: ${{ inputs.final_package_name }}
      INPUT_FINAL_APP_NAME: ${{ inputs.final_app_name }}
      INPUT_ENABLE_ANTI_REVERSE_ENGINEERING: ${{ inputs.enable_anti_reverse_engineering }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2

      - name: "Step 0 - Expand disk and wipe runner bloat"
        timeout-minutes: 3
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache \
            /usr/local/lib/node_modules /home/runner/.cache /home/runner/.rustup /home/runner/.cargo || true
          sudo apt-get clean || true
          df -h /

      - name: Install bounded Python dependencies
        timeout-minutes: 4
        run: timeout -k 15s 240s pip install -r requirements.lock.txt

      - name: Cross-Game Clean Docs Guard (no previous game blueprint leakage)
        timeout-minutes: 2
        run: |
          mkdir -p /tmp/docs_keep
          cp -r docs/dossier_templates /tmp/docs_keep/ 2>/dev/null || true
          cp docs/PRIVACY_POLICY.md /tmp/docs_keep/ 2>/dev/null || true
          rm -rf docs
          mkdir -p docs
          cp -r /tmp/docs_keep/. docs/ 2>/dev/null || true
          rm -rf /tmp/docs_keep
          ls -la docs

      - name: Resolve action mode and final release identity
        id: mode
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ACTION_MODE="${INPUT_ACTION_MODE:-}"
          if [ -z "$ACTION_MODE" ]; then
            ACTION_MODE=$(grep -i '^ACTION_MODE:' ORDER.md | head -1 | cut -d: -f2- | xargs || true)
          fi
          [ -z "$ACTION_MODE" ] && ACTION_MODE="NEW_GAME"
          case "$(echo "$ACTION_MODE" | tr '[:upper:]' '[:lower:]')" in
            *finalize*|*lock*) ACTION_MODE="FINALIZE_AND_LOCK_RELEASE" ;;
            *update*) ACTION_MODE="UPDATE_EXISTING" ;;
            *export*) ACTION_MODE="EXPORT_ONLY" ;;
            *rollback*) ACTION_MODE="ROLLBACK" ;;
            *) ACTION_MODE="NEW_GAME" ;;
          esac
          FINAL_PACKAGE="${INPUT_FINAL_PACKAGE_NAME:-$(grep -i '^FINAL_PACKAGE_NAME:' ORDER.md | head -1 | cut -d: -f2- | xargs || true)}"
          FINAL_APP="${INPUT_FINAL_APP_NAME:-$(grep -i '^FINAL_APP_NAME:' ORDER.md | head -1 | cut -d: -f2- | xargs || true)}"
          ANTI_RE="${INPUT_ENABLE_ANTI_REVERSE_ENGINEERING:-$(grep -i '^ENABLE_ANTI_REVERSE_ENGINEERING:' ORDER.md | head -1 | cut -d: -f2- | xargs || echo true)}"
          echo "action_mode=$ACTION_MODE" >> "$GITHUB_OUTPUT"
          echo "final_package_name=$FINAL_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "final_app_name=$FINAL_APP" >> "$GITHUB_OUTPUT"
          echo "enable_anti_reverse_engineering=$ANTI_RE" >> "$GITHUB_OUTPUT"
          echo "[MODE] $ACTION_MODE | final_package=$FINAL_PACKAGE | anti_re=$ANTI_RE"

      - name: "Pre-Flight API Probe (NVIDIA NIM / Gemini / HF, 10s each)"
        timeout-minutes: 2
        run: timeout -k 15s 60s python3 scripts/preflight_api_probe.py

      - name: Resolve ORDER, run dual-mode recon, and fuse blueprints
        timeout-minutes: 12
        run: |
          mkdir -p /dev/shm/private_studio_vault docs
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 120s python3 scripts/dual_mode_game_factory.py
          REF_LINK=$(jq -r '.ref_link // empty' /dev/shm/private_studio_vault/resolved_job.json 2>/dev/null || true)
          timeout -k 15s 180s python3 scripts/playstore_cleanroom_recon.py "$REF_LINK"
          timeout -k 15s 180s python3 scripts/review_intelligence.py "$REF_LINK"
          timeout -k 15s 90s python3 scripts/ui_element_and_interaction_mapper.py --project-root . --out docs/UI_ELEMENT_AND_INTERACTION_MAP.json
          timeout -k 15s 90s python3 scripts/generate_intelligence_dossier.py
          timeout -k 15s 90s python3 scripts/fusion_engine.py --project-root .
          timeout -k 15s 90s python3 scripts/generate_complete_game_bible.py
          timeout -k 15s 120s python3 scripts/ai_game_designer.py --project-root .

      - name: Stage 1 fail-closed anti-stub gate + one self-heal cycle
        timeout-minutes: 5
        run: |
          set -o pipefail
          GAME_ID=$(jq -r '.game_id' /dev/shm/private_studio_vault/resolved_job.json)
          GENRE=$(jq -r '.genre' /dev/shm/private_studio_vault/resolved_job.json)
          if ! timeout -k 15s 120s python3 scripts/pro_quality_gate.py --stage stage1 --game-id "$GAME_ID" --genre "$GENRE"; then
            echo "[STAGE1] Gate failed; running autonomous self-heal."
            timeout -k 15s 120s python3 scripts/dsh_self_heal.py --stage stage1 --attempt 1
            timeout -k 15s 90s python3 scripts/fusion_engine.py --project-root .
            timeout -k 15s 90s python3 scripts/generate_complete_game_bible.py
            timeout -k 15s 120s python3 scripts/ai_game_designer.py --project-root . --force
            timeout -k 15s 120s python3 scripts/pro_quality_gate.py --stage stage1 --game-id "$GAME_ID" --genre "$GENRE"
          fi

      - name: Upload clean Stage 1 blueprints to HF Vault
        timeout-minutes: 5
        run: timeout -k 15s 240s python3 scripts/hf_vault_sync.py push_stage1_blueprints

      - name: Wipe raw APK / decompiler / recon bloat
        if: always()
        timeout-minutes: 2
        run: |
          rm -rf /tmp/research_dumps /tmp/apk_recon /tmp/rea_dump docs/user_research assets/custom || true
          rm -f /tmp/reference.apk /tmp/base.apk || true
          df -h /

  stage2_original_assets_and_coding:
    needs: stage1_recon_and_blueprints
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTION_MODE: ${{ needs.stage1_recon_and_blueprints.outputs.action_mode }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2

      - name: "Step 0 - Expand disk and wipe runner bloat"
        timeout-minutes: 3
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache \
            /usr/local/lib/node_modules /home/runner/.cache /home/runner/.rustup /home/runner/.cargo || true
          sudo apt-get clean || true
          df -h /

      - name: "Boot virtual screen + audio FIRST, then install bounded deps"
        timeout-minutes: 12
        run: |
          timeout -k 15s 240s sudo apt-get install -y --no-install-recommends xvfb || \
            (timeout -k 15s 180s sudo apt-get update -o Acquire::Retries=3 && timeout -k 15s 240s sudo apt-get install -y --no-install-recommends xvfb)
          if ! command -v pulseaudio >/dev/null; then
            timeout -k 15s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils || true
          fi
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=studio_sink || true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
          timeout -k 15s 240s pip install -r requirements.lock.txt
          timeout -k 15s 60s python3 scripts/stage_cleanup_guard.py --stage stage2 --min-free-gb "${MIN_FREE_GB}"

      - name: Run anti-stub quality gate unit tests
        timeout-minutes: 4
        run: timeout -k 15s 180s python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Download FULL Godot 4.7.2 Stable GUI editor (no server binary)
        timeout-minutes: 5
        run: |
          timeout -k 15s 180s wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION_TAG}_linux.x86_64.zip" -O /tmp/godot.zip
          GODOT_SHA=$(python3 -c "import json;print(json.load(open('config/pinned_toolchains_and_checksums.json'))['godot_official_release']['sha512']['linux_x86_64_zip'])")
          echo "${GODOT_SHA}  /tmp/godot.zip" | sha512sum -c -
          echo "[GODOT_CHECKSUM_OK] Godot_v${GODOT_VERSION_TAG}_linux.x86_64.zip"
          timeout -k 15s 60s unzip -q -o /tmp/godot.zip -d /tmp/godot_extract
          sudo install -m 0755 "/tmp/godot_extract/Godot_v${GODOT_VERSION_TAG}_linux.x86_64" /usr/local/bin/godot
          timeout -k 15s 30s xvfb-run -a -s "-screen 0 720x1280x24" godot --version

      - name: Pull Stage 1 blueprints and initialize vault
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 5
        run: |
          rm -rf docs
          mkdir -p /dev/shm/private_studio_vault docs
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py pull_stage1_blueprints
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py init_or_pull
          GAME_ID=$(jq -r '.game_id' /dev/shm/private_studio_vault/resolved_job.json)
          echo "GAME_ID=$GAME_ID" >> "$GITHUB_ENV"

      - name: "Finalize mode: pull approved latest build from HF Vault (no rebuild)"
        if: needs.stage1_recon_and_blueprints.outputs.action_mode == 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 6
        run: |
          rm -rf docs assets/custom build android
          mkdir -p /dev/shm/private_studio_vault docs
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 180s python3 scripts/hf_vault_sync.py init_or_pull
          GAME_ID=$(jq -r '.game_id' /dev/shm/private_studio_vault/resolved_job.json)
          GENRE=$(jq -r '.genre' /dev/shm/private_studio_vault/resolved_job.json)
          echo "GAME_ID=$GAME_ID" >> "$GITHUB_ENV"
          echo "GENRE=$GENRE" >> "$GITHUB_ENV"

      - name: Cross-Game Clean Workspace Guard
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 3
        run: |
          PREV_GAME_ID=$(jq -r '.previous_game_id // "none"' docs/GAMES_VAULT_LEDGER.json 2>/dev/null || echo "none")
          timeout -k 15s 60s python3 scripts/stage_cleanup_guard.py --stage stage2 --min-free-gb "${MIN_FREE_GB}" --isolate-game "$GAME_ID" "$PREV_GAME_ID"
          rm -rf build android assets/custom
          rm -f project.godot main.tscn export_presets.cfg scripts/game_manager.gd scripts/board_view.gd \
            scripts/ui_controller.gd scripts/main_scene.gd scripts/app_config.gd \
            scripts/procedural_polish_theme_and_vfx.gd \
            scenes/ui_root.tscn scenes/qa_bootstrap.tscn

      - name: Generate 100% original clean-room game (deterministic factory)
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 4
        run: |
          timeout -k 15s 120s python3 scripts/studio_game_factory.py --project-root .
          timeout -k 15s 120s python3 scripts/original_asset_factory.py .
          timeout -k 15s 60s python3 scripts/asset_validator.py

      - name: Run dsh + skills + 24 specialist agents + Zero-Bug Sentinel
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 12
        run: |
          timeout -k 15s 90s python3 scripts/ui_element_and_interaction_mapper.py --project-root . --out docs/UI_ELEMENT_AND_INTERACTION_MAP.json
          timeout -k 15s 90s python3 scripts/fusion_engine.py --project-root .
          timeout -k 15s 60s python3 scripts/godot_legacy_code_scanner.py
          timeout -k 15s 600s python3 scripts/orchestrate_24_agents.py
          timeout -k 15s 120s python3 scripts/zero_bug_sentinel.py --project-root . --game-id "$GAME_ID" --genre auto
          timeout -k 15s 60s python3 scripts/asset_validator.py

      - name: Import generated project in FULL Godot GUI and fail on script errors
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15s 180s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
            godot --editor --path . --import --quit 2>&1 | tee /tmp/godot_import.log
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/godot_import.log; then
            echo "[FAIL_CLOSED] Generated project has script parse errors."
            exit 1
          fi

      - name: Fail-closed Stage 2 anti-stub gate with 3 autonomous self-heal cycles
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 12
        run: |
          set -o pipefail
          GENRE=$(jq -r '.genre' /dev/shm/private_studio_vault/resolved_job.json)
          PASS=0
          for ATTEMPT in 1 2 3; do
            if timeout -k 15s 180s python3 scripts/pro_quality_gate.py --stage stage2 --game-id "$GAME_ID" --genre "$GENRE"; then
              PASS=1
              break
            fi
            echo "[STAGE2] Quality gate failed on attempt $ATTEMPT; invoking dsh self-heal."
            timeout -k 15s 180s python3 scripts/dsh_self_heal.py --stage stage2 --attempt "$ATTEMPT"
            timeout -k 15s 120s python3 scripts/studio_game_factory.py --project-root .
            timeout -k 15s 120s python3 scripts/original_asset_factory.py .
            timeout -k 15s 600s python3 scripts/orchestrate_24_agents.py
            timeout -k 15s 120s python3 scripts/zero_bug_sentinel.py --project-root . --game-id "$GAME_ID" --genre "$GENRE" --runtime-snapshot /tmp/studio_qa/runtime_snapshot.json || true
          done
          if [ "$PASS" -ne 1 ]; then
            timeout -k 15s 180s python3 scripts/pro_quality_gate.py --stage stage2 --game-id "$GAME_ID" --genre "$GENRE"
          fi

      - name: "Finalize mode: verify approved build still passes the anti-stub gate"
        if: needs.stage1_recon_and_blueprints.outputs.action_mode == 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 4
        run: |
          GENRE=$(jq -r '.genre' /dev/shm/private_studio_vault/resolved_job.json)
          timeout -k 15s 180s python3 scripts/pro_quality_gate.py --stage stage2 --game-id "$GAME_ID" --genre "$GENRE"

      - name: Upload coded project snapshot to HF Vault
        if: needs.stage1_recon_and_blueprints.outputs.action_mode != 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 5
        run: timeout -k 15s 240s python3 scripts/hf_vault_sync.py push_stage2_project

      - name: Shred transient stage-2 data
        if: always()
        timeout-minutes: 2
        run: rm -rf /dev/shm/private_studio_vault /dev/shm/hf_stage1 /tmp/godot_extract /tmp/godot.zip || true

  stage3_zero_bug_qa_and_release:
    needs: stage2_original_assets_and_coding
    if: github.actor == github.repository_owner
    environment: production-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTION_MODE: ${{ needs.stage1_recon_and_blueprints.outputs.action_mode }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2

      - name: "Step 0 - Expand disk and wipe runner bloat"
        timeout-minutes: 3
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache \
            /usr/local/lib/node_modules /home/runner/.cache /home/runner/.rustup /home/runner/.cargo || true
          sudo apt-get clean || true
          df -h /

      - name: "Boot virtual screen + audio FIRST, then install release deps"
        timeout-minutes: 15
        run: |
          timeout -k 15s 240s sudo apt-get install -y --no-install-recommends xvfb || \
            (timeout -k 15s 180s sudo apt-get update -o Acquire::Retries=3 && timeout -k 15s 240s sudo apt-get install -y --no-install-recommends xvfb)
          if ! command -v pulseaudio >/dev/null; then
            timeout -k 15s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils || true
          fi
          if ! command -v java >/dev/null; then
            timeout -k 15s 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jdk || true
          fi
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=studio_sink || true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
          JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_SDK_PATH" >> "$GITHUB_ENV"
          echo "JAVA_SDK_PATH=$JAVA_SDK_PATH" >> "$GITHUB_ENV"
          timeout -k 15s 240s pip install -r requirements.lock.txt
          timeout -k 15s 60s python3 scripts/stage_cleanup_guard.py --stage stage3 --min-free-gb "${MIN_FREE_GB}"

      - name: Download FULL Godot GUI + Android export templates + SDK 36
        timeout-minutes: 12
        run: |
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates/"${GODOT_TEMPLATE_ID}"
          timeout -k 15s 180s wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION_TAG}_linux.x86_64.zip" -O /tmp/godot.zip
          GODOT_SHA=$(python3 -c "import json;print(json.load(open('config/pinned_toolchains_and_checksums.json'))['godot_official_release']['sha512']['linux_x86_64_zip'])")
          echo "${GODOT_SHA}  /tmp/godot.zip" | sha512sum -c -
          echo "[GODOT_CHECKSUM_OK] Godot_v${GODOT_VERSION_TAG}_linux.x86_64.zip"
          timeout -k 15s 60s unzip -q -o /tmp/godot.zip -d /tmp/godot_extract
          sudo install -m 0755 "/tmp/godot_extract/Godot_v${GODOT_VERSION_TAG}_linux.x86_64" /usr/local/bin/godot
          timeout -k 15s 30s xvfb-run -a -s "-screen 0 720x1280x24" godot --version

          timeout -k 15s 300s wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION_TAG}_export_templates.tpz" -O /tmp/templates.tpz
          TEMPLATES_SHA=$(python3 -c "import json;print(json.load(open('config/pinned_toolchains_and_checksums.json'))['godot_official_release']['sha512']['export_templates_tpz'])")
          echo "${TEMPLATES_SHA}  /tmp/templates.tpz" | sha512sum -c -
          echo "[GODOT_TEMPLATES_CHECKSUM_OK] Godot_v${GODOT_VERSION_TAG}_export_templates.tpz"
          timeout -k 15s 90s bash -c 'unzip -p /tmp/templates.tpz templates/android_source.zip > /tmp/android_source.zip'
          timeout -k 15s 90s bash -c 'unzip -p /tmp/templates.tpz templates/android_release.apk > ~/.local/share/godot/export_templates/'"${GODOT_TEMPLATE_ID}"'/android_release.apk'
          timeout -k 15s 90s bash -c 'unzip -p /tmp/templates.tpz templates/android_debug.apk > ~/.local/share/godot/export_templates/'"${GODOT_TEMPLATE_ID}"'/android_debug.apk'
          cp /tmp/android_source.zip ~/.local/share/godot/export_templates/"${GODOT_TEMPLATE_ID}"/android_source.zip

          # Install the official Gradle project and the .build_version marker that
          # Godot requires for gradle-built templates. build_version lives in the
          # PARENT of android/build (Godot: get_android_build_directory().get_base_dir()).
          rm -rf android
          mkdir -p android/build
          timeout -k 15s 90s unzip -q /tmp/android_source.zip -d android/build
          printf '%s\n' "${GODOT_TEMPLATE_ID}" > android/.build_version
          : > android/build/.gdignore
          chmod +x android/build/gradlew
          test -s android/build/config.gradle
          test -s android/build/build.gradle
          test -s android/.build_version

          SDK=/usr/local/lib/android/sdk
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            timeout -k 15s 90s bash -c "yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1" || true
            timeout -k 15s 300s "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "platforms;android-35" "platforms;android-34" \
              "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"
          fi
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/35.0.0"

          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_SDK_PATH}"
          export/android/android_sdk_path = "${SDK}"
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Pull Stage 2 project and resolve release identity
        timeout-minutes: 5
        run: |
          rm -rf docs assets/custom
          rm -f project.godot main.tscn export_presets.cfg scripts/game_manager.gd scripts/board_view.gd \
            scripts/ui_controller.gd scripts/main_scene.gd scripts/app_config.gd \
            scripts/procedural_polish_theme_and_vfx.gd \
            scenes/ui_root.tscn scenes/qa_bootstrap.tscn
          mkdir -p /dev/shm/private_studio_vault /tmp/qa_videos docs
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py resolve_command
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py pull_stage2_project
          timeout -k 15s 120s python3 scripts/hf_vault_sync.py init_or_pull
          GAME_ID=$(jq -r '.game_id' /dev/shm/private_studio_vault/resolved_job.json)
          GENRE=$(jq -r '.genre' /dev/shm/private_studio_vault/resolved_job.json)
          echo "GAME_ID=$GAME_ID" >> "$GITHUB_ENV"
          echo "GENRE=$GENRE" >> "$GITHUB_ENV"

      - name: Import Stage 2 project assets in FULL Godot GUI (no headless)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15s 240s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
            godot --editor --path . --import --quit 2>&1 | tee /tmp/godot_import_stage3.log
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/godot_import_stage3.log; then
            echo "[FAIL_CLOSED] Stage 3 project import has script parse errors."
            exit 1
          fi

      - name: Zero-Bug Sentinel on live runtime snapshots (anti-stuck / anti-clipping / grounding)
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/studio_qa
          timeout -k 15s 180s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
            godot --rendering-method gl_compatibility --rendering-driver opengl3 --path . \
            res://scenes/qa_bootstrap.tscn -- --qa-mode=true --suite=runtime_snapshot --qa-output-dir=/tmp/studio_qa
          test -s /tmp/studio_qa/runtime_snapshot.json
          timeout -k 15s 120s python3 scripts/zero_bug_sentinel.py --project-root . --game-id "$GAME_ID" --genre "$GENRE" --runtime-snapshot /tmp/studio_qa/runtime_snapshot.json

      - name: "4 Movie Maker QA videos + strict visual critic + 3 autonomous self-heal cycles"
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p /tmp/studio_qa /tmp/qa_videos docs
          GAME_CAT=$(jq -r '.game_category // "level_by_level"' /dev/shm/private_studio_vault/resolved_job.json)
          MAIN_GAMEPLAY_SUITE=multi_levels
          [[ "$GAME_CAT" == "endless_map_chunks" ]] && MAIN_GAMEPLAY_SUITE=endless_chunks
          QUIT_FRAMES=150
          PASS=0
          for ATTEMPT in 1 2 3; do
            echo "=== QA SELF-HEAL CYCLE $ATTEMPT/3 ==="
            rm -f docs/VISUAL_CRITIC_REPORT.json docs/ZERO_BUG_SENTINEL_REPORT.json
            rm -f /tmp/studio_qa/telemetry_*.txt /tmp/qa_videos/*.mp4 /tmp/qa_videos/*.avi /tmp/studio_qa/qa_4cam_grid_*.png
            timeout -k 15s 180s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
              godot --rendering-method gl_compatibility --rendering-driver opengl3 --path . \
              res://scenes/qa_bootstrap.tscn -- --qa-mode=true --suite=runtime_snapshot --qa-output-dir=/tmp/studio_qa
            test -s /tmp/studio_qa/runtime_snapshot.json
            timeout -k 15s 120s python3 scripts/zero_bug_sentinel.py --project-root . --game-id "$GAME_ID" --genre "$GENRE" --runtime-snapshot /tmp/studio_qa/runtime_snapshot.json
            VIDEO_FAIL=0
            for SUITE in "ui_shop" "mechanics_lab" "$MAIN_GAMEPLAY_SUITE" "save_ads_and_edge"; do
              AVI="/tmp/qa_videos/${SUITE}.avi"; MP4="/tmp/qa_videos/${SUITE}.mp4"
              rm -f "/tmp/studio_qa/telemetry_${SUITE}.txt" "$AVI" "$MP4" "/tmp/studio_qa/qa_4cam_grid_${SUITE}.png"
              timeout -k 15s 180s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
                godot --rendering-method gl_compatibility --rendering-driver opengl3 --write-movie "$AVI" --fixed-fps 15 --quit-after "$QUIT_FRAMES" \
                res://scenes/qa_bootstrap.tscn -- --qa-mode=true --suite="$SUITE" --qa-output-dir=/tmp/studio_qa
              test -s "/tmp/studio_qa/telemetry_${SUITE}.txt"
              FFMPEG_BIN=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
              timeout -k 15s 90s "$FFMPEG_BIN" -y -i "$AVI" -vf scale=720:1280 -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 96k "$MP4"
              rm -f "$AVI"
              if ! timeout -k 15s 90s python3 scripts/multi_video_inspector.py "$SUITE" "$MP4" /tmp/studio_qa --project-root .; then
                VIDEO_FAIL=1
                break
              fi
            done
            if [ "$VIDEO_FAIL" -eq 0 ]; then
              timeout -k 15s 120s python3 scripts/independent_polish_reviewer.py . || VIDEO_FAIL=1
            fi
            if [ "$VIDEO_FAIL" -eq 0 ] && timeout -k 15s 180s python3 scripts/pro_quality_gate.py --stage stage3 --game-id "$GAME_ID" --genre "$GENRE"; then
              PASS=1
              break
            fi
            echo "[STAGE3] Visual/quality rejection on attempt $ATTEMPT; invoking dsh self-heal + rebuild."
            rm -f /tmp/pro_quality_feedback.json
            timeout -k 15s 180s python3 scripts/dsh_self_heal.py --stage stage3 --attempt "$ATTEMPT" || true
            timeout -k 15s 120s python3 scripts/studio_game_factory.py --project-root .
            timeout -k 15s 120s python3 scripts/original_asset_factory.py .
            timeout -k 15s 90s python3 scripts/ui_element_and_interaction_mapper.py --project-root . --out docs/UI_ELEMENT_AND_INTERACTION_MAP.json || true
          done
          if [ "$PASS" -ne 1 ]; then
            timeout -k 15s 180s python3 scripts/pro_quality_gate.py --stage stage3 --game-id "$GAME_ID" --genre "$GENRE"
          fi

      - name: "Finalize release lock: package rename, R8/ProGuard, encrypted config vault, signer check"
        if: needs.stage1_recon_and_blueprints.outputs.action_mode == 'FINALIZE_AND_LOCK_RELEASE'
        timeout-minutes: 5
        run: |
          timeout -k 15s 180s python3 scripts/finalize_release.py --project-root . --vault-dir /dev/shm/private_studio_vault
          test -s docs/FINAL_RELEASE_LOCK.json
          test -s assets/secure/config_vault.enc
          grep -q 'package/unique_name="' export_presets.cfg

      - name: Switch AD_MODE to PRODUCTION and export signed APK + AAB
        timeout-minutes: 20
        run: |
          sed -i 's/const AD_MODE := "MOCK_TEMPLATE"/const AD_MODE := "PRODUCTION"/' scripts/app_config.gd
          grep -q 'const AD_MODE := "PRODUCTION"' scripts/app_config.gd
          cp -f export_presets.cfg export_presets.cfg.bak
          cp -f scripts/app_config.gd scripts/app_config.gd.bak
          timeout -k 15s 60s python3 scripts/hf_vault_sync.py inject_export_secrets
          mkdir -p build/android
          timeout -k 15s 900s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
            godot --rendering-method gl_compatibility --rendering-driver opengl3 --editor \
            --export-release "Android (Direct Install APK)" build/android/game_install.apk
          timeout -k 15s 900s xvfb-run --auto-servernum -s "-screen 0 720x1280x24" \
            godot --rendering-method gl_compatibility --rendering-driver opengl3 --editor \
            --export-release "Android (Play Store Signed AAB)" build/android/game_release.aab
          test -s build/android/game_install.apk
          test -s build/android/game_release.aab
          if command -v aapt >/dev/null 2>&1; then
            timeout -k 15s 60s aapt dump badging build/android/game_install.apk > /tmp/apk_badging.txt
            grep -q "targetSdkVersion:'36'" /tmp/apk_badging.txt
            grep -q "sdkVersion:'24'" /tmp/apk_badging.txt
            grep -q "native-code: 'arm64-v8a'" /tmp/apk_badging.txt
            echo "[APK_MANIFEST_VERIFIED] targetSdkVersion=36 minSdkVersion=24 native-code=arm64-v8a"
          else
            echo "[WARN] aapt not found; target SDK verified from export preset only."
          fi
          timeout -k 15s 180s python3 scripts/verify_android_builds.py --post-build build/android/game_install.apk build/android/game_release.aab /dev/shm/private_studio_vault/keystore_meta.json
          timeout -k 15s 90s python3 scripts/verify_android_builds.py --release-gate build/android/game_install.apk build/android/game_release.aab

      - name: Build Store-Kit and sync versioned release to HF Vault
        timeout-minutes: 10
        run: |
          timeout -k 15s 60s python3 scripts/store_kit_builder.py --project-root . --out build/store_kit
          timeout -k 15s 540s python3 scripts/hf_vault_sync.py push_private_everything
          if [ "${ACTION_MODE:-NEW_GAME}" = "FINALIZE_AND_LOCK_RELEASE" ]; then
            timeout -k 15s 300s python3 scripts/hf_vault_sync.py push_final_release
          fi
          timeout -k 15s 60s python3 scripts/godot_version_migrator.py --check

      - name: Stage release assets (APK, AAB, QA videos, Store-Kit, Sentinel report)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p build/release_assets
          cp build/android/game_install.apk build/release_assets/
          cp build/android/game_release.aab build/release_assets/
          cp /tmp/qa_videos/*.mp4 build/release_assets/
          cp build/store_kit/icon_512x512.png build/release_assets/ 2>/dev/null || true
          cp build/store_kit/feature_graphic_1024x500.png build/release_assets/ 2>/dev/null || true
          cp docs/ZERO_BUG_SENTINEL_REPORT.json build/release_assets/ 2>/dev/null || true
          sha256sum build/release_assets/* > build/release_assets/SHA256SUMS.txt
          ls -lh build/release_assets

      - name: Upload APK/AAB/QA videos as GitHub Actions artifacts (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ${{ env.GAME_ID }}-${{ github.run_number }}-release
          path: build/release_assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with signed APK, AAB, and QA videos
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import re,pathlib;t=pathlib.Path('ORDER.md').read_text(encoding='utf-8');m=re.search(r'^GAME_VERSION:\s*(\S+)',t,re.M);print(m.group(1) if m else 'v1.0.0')")
          if [ "${ACTION_MODE:-NEW_GAME}" = "FINALIZE_AND_LOCK_RELEASE" ]; then
            FINAL_PKG=$(python3 -c "import re,pathlib;t=pathlib.Path('ORDER.md').read_text(encoding='utf-8');m=re.search(r'^FINAL_PACKAGE_NAME:\s*(\S+)',t,re.M);print(m.group(1) if m else 'final')")
            TAG="${GAME_ID}-${FINAL_PKG}-${VERSION}"
            TITLE="AI Game Studio FINAL LOCK - ${FINAL_PKG} ${VERSION}"
          else
            FINAL_PKG=""
            TAG="${GAME_ID}-${VERSION}"
            TITLE="AI Game Studio - ${GAME_ID} ${VERSION}"
          fi
          APK=build/release_assets/game_install.apk
          AAB=build/release_assets/game_release.aab
          APK_SIZE=$(stat -c%s "$APK")
          AAB_SIZE=$(stat -c%s "$AAB")
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          AAB_SHA=$(sha256sum "$AAB" | awk '{print $1}')
          NOTES=$(cat <<EOF
          ## AI Game Studio V5.0 Pro — ${GAME_ID}

          - **Genre:** ${GENRE}
          - **Version:** ${VERSION}
          - **Build:** ${GITHUB_RUN_NUMBER}
          - **Commit:** ${GITHUB_SHA}
          - **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **QA:** Zero-Bug Sentinel PASS; 4 Movie Maker QA videos PASS
          - **Android:** Target SDK 36, Min SDK 24, arm64-v8a, 16 KB page aligned
          - **Final package:** ${FINAL_PKG:-preview package}
          - **Hardening:** R8/ProGuard, binary resources, encrypted config vault, signer fingerprint (final mode)

          ### Direct downloads
          - \`game_install.apk\` — signed, direct Android install (${APK_SIZE} bytes, SHA-256 \`${APK_SHA}\`)
          - \`game_release.aab\` — signed, Google Play upload (${AAB_SIZE} bytes, SHA-256 \`${AAB_SHA}\`)
          - QA videos: \`ui_shop.mp4\`, \`mechanics_lab.mp4\`, \`multi_levels.mp4\` or \`endless_chunks.mp4\`, \`save_ads_and_edge.mp4\`

          Install: \`adb install -r game_install.apk\`
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release_assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/release_assets/* --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
          echo "RELEASE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published GitHub Release assets (aapt / apksigner / jarsigner)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import re,pathlib;t=pathlib.Path('ORDER.md').read_text(encoding='utf-8');m=re.search(r'^GAME_VERSION:\s*(\S+)',t,re.M);print(m.group(1) if m else 'v1.0.0')")
          if [ "${ACTION_MODE:-NEW_GAME}" = "FINALIZE_AND_LOCK_RELEASE" ]; then
            FINAL_PKG=$(python3 -c "import re,pathlib;t=pathlib.Path('ORDER.md').read_text(encoding='utf-8');m=re.search(r'^FINAL_PACKAGE_NAME:\s*(\S+)',t,re.M);print(m.group(1) if m else 'final')")
            TAG="${GAME_ID}-${FINAL_PKG}-${VERSION}"
          else
            TAG="${GAME_ID}-${VERSION}"
          fi
          rm -rf /tmp/release_verify
          mkdir -p /tmp/release_verify
          for i in 1 2 3 4 5; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release_verify --clobber; then break; fi
            sleep 3
          done
          test -s /tmp/release_verify/game_install.apk
          test -s /tmp/release_verify/game_release.aab
          aapt dump badging /tmp/release_verify/game_install.apk > /tmp/release_badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/release_badging.txt
          grep -q "sdkVersion:'24'" /tmp/release_badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/release_badging.txt
          apksigner verify --print-certs /tmp/release_verify/game_install.apk
          jarsigner -verify -verbose -certs /tmp/release_verify/game_release.aab > /tmp/release_jarsigner.txt
          grep -q "jar verified" /tmp/release_jarsigner.txt
          for f in /tmp/release_verify/*.mp4; do test -s "$f"; done
          echo "[RELEASE_ASSETS_VERIFIED] ${TAG}"

      - name: Shred temporary secrets, builds, and restore un-injected config
        if: always()
        timeout-minutes: 2
        run: |
          rm -rf /dev/shm/private_studio_vault /dev/shm/hf_stage1 /dev/shm/hf_stage2 /dev/shm/version_stage /dev/shm/ks_upload_only /tmp/qa_videos /tmp/godot_extract /tmp/godot.zip /tmp/templates.tpz /tmp/android_source.zip build
          if [ -f export_presets.cfg.bak ]; then mv -f export_presets.cfg.bak export_presets.cfg; fi
          if [ -f scripts/app_config.gd.bak ]; then mv -f scripts/app_config.gd.bak scripts/app_config.gd; fi
